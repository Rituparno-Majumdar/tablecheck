[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tablecheck"
version = "0.1.0"
description = "Validate Markdown table structure — detect malformed tables, broken alignment, inconsistent columns"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
tablecheck = "tablecheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
